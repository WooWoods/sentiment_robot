name: Daily Sentiment Scan

on:
  schedule:
    # 每天北京时间 08:00 (UTC 00:00)
    - cron: '47 23 * * *'
  # 支持在 GitHub 网页上手动点击运行
  workflow_dispatch:
    inputs:
      run_type:
        description: '运行模式 (daily 或 breaking)'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - breaking

jobs:
  run-sentiment-robot:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装项目与依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[llm]"

      - name: 执行市场情绪扫描
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          SENTIMENT_ROBOT_LLM_MODEL: ${{ secrets.SENTIMENT_ROBOT_LLM_MODEL || 'gpt-4o-mini' }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          SENTIMENT_ROBOT_LLM_ENABLED: 'true'
        run: |
          RUN_CMD="${{ inputs.run_type || 'daily' }}"
          python -m sentiment_robot "$RUN_CMD"

      - name: 归档运行产物 (数据库与日志)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentiment-robot-artifacts
          path: |
            sentiment_robot.db
            output/
            logs/
          retention-days: 14
