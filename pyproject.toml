[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-robot"
version = "0.1.0"
description = "Daily multi-source market sentiment scanner"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "requests>=2.31",
]

[project.optional-dependencies]
llm = ["openai>=1.0"]
dev = ["pytest>=7.0", "pytest-mock>=3.10"]

[tool.setuptools.packages.find]
exclude = ["TradingAgents*", "docs*", "tests*"]

[project.scripts]
sentiment-robot = "sentiment_robot.cli:main"
